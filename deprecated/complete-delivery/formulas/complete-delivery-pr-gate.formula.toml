description = """
Bounded current-head review loop for Complete Delivery.

Each iteration freezes the current PR head, batches valid CI and review
findings, applies one consolidated repair, reruns repository gates, pushes
fixes, and updates the living report. The mechanical terminal check passes
only on the same green head with no unresolved human threads or outstanding
change requests. Optional provider evidence is controlled by pack variables.
"""
formula = "complete-delivery-pr-gate"
type = "expansion"
version = 1
contract = "graph.v2"

[requires]
formula_compiler = ">=2.0.0"

# The expansion target is the scope body. Its outcome is therefore the exact
# value consumed by Complete Delivery's outer `external-review` release member:
# a failed setup, loop, or final report cannot look merely "closed" to
# `report-green`, merge, or deploy.
[[template]]
id = "{target}"
title = "External review safety scope"
needs = ["{target}.setup-external-review", "{target}.external-review-loop", "{target}.finalize-external-review"]
metadata = { "gc.kind" = "scope", "gc.scope_name" = "complete-delivery-external-review", "gc.scope_role" = "body" }
description_file = "../assets/workflows/complete-delivery-pr-gate/{target}.external-review-body.md"

[[template]]
id = "{target}.setup-external-review"
title = "Prepare external review reconciliation"
metadata = { "gc.run_target" = "complete-delivery.external-review-resolver", "gc.scope_ref" = "{target}", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/complete-delivery-pr-gate/{target}.setup-external-review.md"

[template.check]
max_attempts = 1

[template.check.check]
mode = "exec"
path = ".gc/scripts/checks/delivery-external-review-deadline.sh"
timeout = "1m"

[[template]]
id = "{target}.external-review-loop"
title = "Run one frozen-head review and repair cycle"
needs = ["{target}.setup-external-review"]
metadata = { "gc.run_target" = "complete-delivery.external-review-resolver", "gc.review_policy" = "frozen-candidate-two-cycle", "gc.scope_ref" = "{target}", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/complete-delivery-pr-gate/{target}.external-review-loop.md"

[template.check]
max_attempts = 2

[template.check.check]
mode = "exec"
path = ".gc/scripts/checks/delivery-pr-approved.sh"
timeout = "10m"

[[template.children]]
id = "{target}.inspect-current-head"
title = "Inspect current-head CI and review evidence"
metadata = { "gc.run_target" = "complete-delivery.external-review-resolver" }
description_file = "../assets/workflows/complete-delivery-pr-gate/{target}.inspect-current-head.md"

[[template.children]]
id = "{target}.resolve-findings"
title = "Batch and resolve valid findings"
needs = ["{target}.inspect-current-head"]
metadata = { "gc.run_target" = "complete-delivery.external-review-resolver", "gc.continuation_group" = "complete-delivery-pr-fixes" }
description_file = "../assets/workflows/complete-delivery-pr-gate/{target}.resolve-findings.md"

[[template.children]]
id = "{target}.rerun-local-gates"
title = "Rerun repository-native gates"
needs = ["{target}.resolve-findings"]
metadata = { "gc.run_target" = "complete-delivery.external-review-resolver", "gc.continuation_group" = "complete-delivery-pr-fixes" }
description_file = "../assets/workflows/complete-delivery-pr-gate/{target}.rerun-local-gates.md"

[[template.children]]
id = "{target}.publish-fixes"
title = "Publish review fixes"
needs = ["{target}.rerun-local-gates"]
metadata = { "gc.run_target" = "complete-delivery.external-review-resolver", "gc.continuation_group" = "complete-delivery-pr-fixes" }
description_file = "../assets/workflows/complete-delivery-pr-gate/{target}.publish-fixes.md"

[[template.children]]
id = "{target}.report-external-review"
title = "Update the living review status"
needs = ["{target}.publish-fixes"]
metadata = { "gc.run_target" = "complete-delivery.report-editor" }
description_file = "../assets/workflows/complete-delivery-pr-gate/{target}.report-external-review.md"

[[template]]
id = "{target}.finalize-external-review"
title = "Finalize external review gate"
needs = ["{target}.external-review-loop"]
metadata = { "gc.run_target" = "complete-delivery.report-editor", "gc.scope_ref" = "{target}", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/complete-delivery-pr-gate/{target}.md"
